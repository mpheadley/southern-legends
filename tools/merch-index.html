function imgSrc(photo) {
  if (!photo) return '';
  return '../public' + photo;
}

function isContain(photo) {
  return photo && (photo.includes('/print-files/') || photo.includes('-trans.') || photo.includes('-nobg.'));
}

function render(filter) {
  let list = ITEMS;
  if (filter === 'fw-only') list = ITEMS.filter(i => i.fw);
  else if (filter === 'print-file') list = ITEMS.filter(i => i.printFile);
  else if (filter === 'available') list = ITEMS.filter(i => i.avail);
  else if (filter !== 'all') list = ITEMS.filter(i => i.cat === filter);

  document.getElementById('meta').textContent = list.length + ' of 159 items';
  document.getElementById('stats').textContent =
    'Shirts: ' + list.filter(i=>i.cat==='shirt').length +
    '  ·  FW photos: ' + list.filter(i=>i.fw).length +
    '  ·  Print graphics: ' + list.filter(i=>i.printFile).length +
    '  ·  Available: ' + list.filter(i=>i.avail).length;

  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  list.forEach(function(item) {
    const src = imgSrc(item.photo);
    const contain = isContain(item.photo);
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<div class="iw">' +
        (src ? '<img src="' + src + '" class="' + (contain ? 'contain' : '') + '" alt="" onerror="this.outerHTML='<div class=ni>no image<small>' + item.photo.split('/').pop() + '</small></div>'">' : '<div class="ni">no photo</div>') +
        (item.badge ? '<span class="bdg">' + item.badge + '</span>' : '') +
        (item.fw ? '<span class="fw">FW</span>' : (item.printFile ? '<span class="pf">print-file</span>' : '')) +
        (!item.avail ? '<div class="ov"><span class="ovl">Unavailable</span></div>' : '') +
      '</div>' +
      '<div class="info">' +
        '<div class="cl">' + item.cat + '</div>' +
        '<div class="nm">' + item.name + '</div>' +
        '<div class="pr">' + (item.price ? '$' + item.price : '—') + '</div>' +
        '<div class="id">' + item.id + '</div>' +
      '</div>';
    grid.appendChild(card);
  });
}

document.querySelectorAll('.fb').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.fb').forEach(function(b) { b.classList.remove('on'); });
    btn.classList.add('on');
    render(btn.dataset.f);
  });
});

render('all');
</script>
